# =============================================================================
# WIFI QUEST - Docker Compose (Dokploy)
#
# Dominios (routing por labels de Traefik, "Method 2" de Dokploy):
#   Frontend -> https://k.alexa.tja.ucb.edu.bo   (puerto 80)
#   Backend  -> https://k2.alexa.tja.ucb.edu.bo  (puerto 3000)
#
# Los servicios se cuelgan de la red externa `dokploy-network` (la red de
# Traefik que crea Dokploy). Así NO se crea una red default por proyecto, lo
# que evita el error "address pools have been fully subnetted".
#
# No configures estos dominios en la pestaña "Domains" de Dokploy: los labels
# de acá ya hacen el routing (si los agregás por la UI se duplican los routers).
#
# Sin secretos hardcodeados: todo se lee del .env (pestaña "Environment").
# =============================================================================

services:

  # ── Backend (Hono + motor Nivel 1/2) ────────────────────────────────────────
  backend:
    build:
      # Monorepo npm workspaces: el build necesita el package.json de la raíz.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      WIFI_PASS: ${WIFI_PASS}
      LEVEL1_ENGINE: ${LEVEL1_ENGINE}
      REVEAL_WORD_TO_MODEL: ${REVEAL_WORD_TO_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_KEY: ${CF_API_KEY}
      CF_MODEL: ${CF_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.wifi-quest-backend.rule=Host(`k2.alexa.tja.ucb.edu.bo`)
      - traefik.http.routers.wifi-quest-backend.entrypoints=websecure
      - traefik.http.routers.wifi-quest-backend.tls=true
      - traefik.http.routers.wifi-quest-backend.tls.certresolver=letsencrypt
      - traefik.http.services.wifi-quest-backend.loadbalancer.server.port=3000

  # ── Frontend (Vite/React servido por nginx) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.wifi-quest-frontend.rule=Host(`k.alexa.tja.ucb.edu.bo`)
      - traefik.http.routers.wifi-quest-frontend.entrypoints=websecure
      - traefik.http.routers.wifi-quest-frontend.tls=true
      - traefik.http.routers.wifi-quest-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.wifi-quest-frontend.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
