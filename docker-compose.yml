# =============================================================================
# WIFI QUEST - Docker Compose global (despliegue en Dokploy)
#
# Dominios:
#   Frontend -> https://k.alexa.tja.ucb.edu.bo
#   Backend  -> https://k2.alexa.tja.ucb.edu.bo
#
# No hay secretos hardcodeados: las variables se leen desde el archivo .env
# (o desde la pestaña "Environment" de Dokploy, que escribe ese .env).
# Copiá .env.example a .env y completá los valores reales.
#
# Routing con Traefik (configuración manual, "Method 2" de la doc de Dokploy):
#   - Red compartida: dokploy-network (external)
#   - Entrypoint HTTPS: websecure
#   - Certificados: letsencrypt
# Si preferís, podés borrar los bloques `labels` y `networks` y configurar los
# dominios desde la pestaña "Domains" de Dokploy (recomendado por Dokploy,
# inyecta los labels y la red por vos).
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Origen permitido para CORS (el frontend)
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://k.alexa.tja.ucb.edu.bo}
      # Contraseña WiFi (obligatoria para /api/verify). Sin valor por defecto.
      WIFI_PASS: ${WIFI_PASS:?WIFI_PASS es obligatoria. Definila en .env o en Dokploy.}
      LEVEL1_ENGINE: ${LEVEL1_ENGINE:-v2}
      REVEAL_WORD_TO_MODEL: ${REVEAL_WORD_TO_MODEL:-true}
      # Proveedores de IA (opcionales: si una key queda vacía se salta el proveedor)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_MODEL: ${CF_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.wifi-quest-backend.rule=Host(`k2.alexa.tja.ucb.edu.bo`)
      - traefik.http.routers.wifi-quest-backend.entrypoints=websecure
      - traefik.http.routers.wifi-quest-backend.tls=true
      - traefik.http.routers.wifi-quest-backend.tls.certresolver=letsencrypt
      - traefik.http.services.wifi-quest-backend.loadbalancer.server.port=3000
    networks:
      - dokploy-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # URL pública del backend que el frontend usa para /api (build-time)
        VITE_API_URL: ${VITE_API_URL:-https://k2.alexa.tja.ucb.edu.bo}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.wifi-quest-frontend.rule=Host(`k.alexa.tja.ucb.edu.bo`)
      - traefik.http.routers.wifi-quest-frontend.entrypoints=websecure
      - traefik.http.routers.wifi-quest-frontend.tls=true
      - traefik.http.routers.wifi-quest-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.wifi-quest-frontend.loadbalancer.server.port=80
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
