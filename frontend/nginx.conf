server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con hash en el nombre -> cache inmutable
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No exponer archivos ocultos
    location ~ /\. {
        deny all;
    }
}
